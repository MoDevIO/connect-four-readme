name: Do Move

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  do-move:
    if: startsWith(github.event.issue.title, 'do_move:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract move
        id: move
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" =~ ^do_move:([0-9]+)$ ]]; then
            echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid issue title: $TITLE"
            exit 1
          fi
      
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run script
        run: node src/engine.js "${{ steps.move.outputs.value }}" && node src/drawBoard.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "do_move: ${{ steps.move.outputs.value }}"
          git push